name: Deploy MOA independently
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: moa-production
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ppapigo/chat
          ref: main
          path: chat-source
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ppapigo/board-app:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/ppapigo/board-frontend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./chat-source
          push: true
          tags: ghcr.io/ppapigo/chat-app:${{ github.sha }}
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Stage deploy files (do not modify Caddyfile)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: docker-compose.yml,scripts/deploy.sh
          target: /home/${{ secrets.LIGHTSAIL_USER }}/board/.deploy/incoming
      - name: Deploy MOA services only
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOARD_IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: BOARD_IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/board"
            mv .deploy/incoming/docker-compose.yml .deploy/docker-compose.yml
            chmod +x .deploy/incoming/scripts/deploy.sh
            bash .deploy/incoming/scripts/deploy.sh
