name: Deploy to Lightsail Board server
on:
  push:
    branches: ["main"]
  workflow_dispatch: #재 배포를 위한 수동 트리거 버튼 추가

permissions:
  contents: read
  packages: write

#병렬 처리 여부
concurrency:
  group: deploy-lightsail
  cancel-in-progress: true #다른 작업이 들어오면 이 작업을 취소함


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK21 설치 (temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Buildx 설정(GHA 캐시 사용을 위해)
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ppapigo/board-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: react front-end 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/ppapigo/board-frontend:latest
          cache-from: type=gha,scope=fer
          cache-to: type=gha,mode=max,scope=fer


  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lightsail SSH 접속후 배포
        uses: appleboy/ssh-action@v1.2.0

        env:
          KAKAO_REST_API: ${{ secrets.KAKAO_REST_API }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_CALLBACK: ${{ secrets.KAKAO_CALLBACK }}
          APP_PUBLIC_BASE_URL: ${{ secrets.APP_PUBLIC_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 30m
          envs: KAKAO_REST_API,KAKAO_SECRET,KAKAO_CALLBACK,APP_PUBLIC_BASE_URL,JWT_SECRET,DEPLOY_HOST,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,DB_NAME,DB_USERNAME,DB_PASSWORD, GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            [ -d ~/board/.git ] || git clone https://github.com/ppapigo/board.git ~/board
            cd ~/board
            git fetch --all && git reset --hard origin/main
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
