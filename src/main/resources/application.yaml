server:
  port: 8090

spring:
  application:
    name: board

  datasource:
    url: jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

jwt:
  secret: bXlfc3VwZXJfc2VjcmV0X2JvYXJkX2JhY2tlbmRfYXBwX3RyYWluaW5nX2tleQ==
  access-token-validity-seconds: 60 #1시간

logging:
  level:
    com.example.board: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
