spring:
  datasource:
    url: jdbc:h2:mem:board;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
          google:
            client-id: test-google-client
            client-secret: test-google-secret

app:
  oauth:
    kakao:
      appkey: test-kakao-client
      secret: test-kakao-secret
      callback: http://localhost/api/oauth/kakao/callback

jwt:
  secret: dGVzdF9qd3Rfc2VjcmV0X2tleV9tdXN0X2JlX2F0X2xlYXN0XzMyX2J5dGVz
