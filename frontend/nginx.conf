map $http_x_forwarded_proto $fwd_proto{
    "" $scheme;
    default $http_x_forwarded_proto;
}
map $http_x_forwarded_port $fwd_port{
    "" $server_port;
    default $http_x_forwarded_port;
}


server{
    #port
    listen 80;
    server_name grooverapp.com www.grooverapp.com board.grooverapp.com;

    #정적 파일 서빙 루트 디렉토리
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/{
        proxy_pass http://board-back-end:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        #가져온 프록시/클라이언트 IP 체인 (감시용)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /images/ {
        proxy_pass http://board-back-end:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~^/(oauth2|login/oauth2){
        proxy_pass http://board-back-end:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        #가져온 프록시/클라이언트 IP 체인 (감시용)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 5m;
        add_header Cache-Control "public";
    }
}